[project]
name = "fable-python"
version = "0.2.0"
description = "Fable Python F# Advent 2025"
readme = "README.md"
requires-python = ">=3.14"
authors = [
    {name = "Dag Brattli", email = "dag@brattli.net"},
]
license = {text = "ISC"}
dependencies = [
    "fable-library==5.0.0",
    "pydantic>=2.12.5",
]

[dependency-groups]
dev = [
    "ruff>=0.14.7",
]

[tool.ruff]
exclude = ["fable_modules"]

[tool.ruff.lint]
ignore = [
    "F841",  # Unused variable - common in generated Fable code
    "F401",  # Unused import - common in generated Fable code
]
